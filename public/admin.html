<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--text:#f0f0f5;--muted:#a0a0b8;--dim:#6b6b80;--accent:#667eea;--grad:linear-gradient(135deg,#667eea,#764ba2);--border:rgba(255,255,255,.06);--r:12px;--t:.3s ease}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:40px;width:100%;max-width:400px;text-align:center}
        .login-box h1{font-size:1.8rem;margin-bottom:8px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .login-box p{color:var(--muted);margin-bottom:28px;font-size:.9rem}
        .field{margin-bottom:16px;text-align:left}
        .field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px}
        .field input{width:100%;padding:11px 14px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:.95rem;outline:none;transition:var(--t)}
        .field input:focus{border-color:var(--accent)}
        .login-btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--grad);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:var(--t)}
        .login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(102,126,234,.3)}
        .login-error{color:#fa709a;font-size:.85rem;margin-top:12px;display:none}
        .admin{display:none}
        .admin-bar{background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .admin-logo{font-size:1.3rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .admin-bar-right{display:flex;align-items:center;gap:16px}
        .admin-bar-right a{color:var(--muted);font-size:.85rem;text-decoration:none;transition:var(--t)}
        .admin-bar-right a:hover{color:var(--accent)}
        .logout-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;transition:var(--t)}
        .logout-btn:hover{border-color:#fa709a;color:#fa709a}
        .admin-body{max-width:1100px;margin:0 auto;padding:32px 24px}
        .admin-tabs{display:flex;gap:6px;margin-bottom:32px;flex-wrap:wrap}
        .tab-btn{padding:8px 20px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:500;transition:var(--t)}
        .tab-btn.active{background:var(--grad);color:#fff;border-color:transparent}
        .tab-panel{display:none}
        .tab-panel.active{display:block}
        .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
        .panel-header h2{font-size:1.4rem;font-weight:700}
        .add-btn{padding:8px 20px;border-radius:8px;border:none;background:var(--grad);color:#fff;cursor:pointer;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:var(--t)}
        .add-btn:hover{transform:translateY(-1px)}
        .data-table{width:100%;border-collapse:collapse}
        .data-table th{text-align:left;padding:12px 16px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--border)}
        .data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.9rem;color:var(--muted);vertical-align:middle}
        .data-table tr:hover td{background:rgba(255,255,255,.02)}
        .action-btns{display:flex;gap:8px}
        .act-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:var(--t)}
        .act-btn:hover{border-color:var(--accent);color:var(--accent)}
        .act-btn.del:hover{border-color:#fa709a;color:#fa709a}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.open{display:flex}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px;width:100%;max-width:560px;max-height:80vh;overflow-y:auto}
        .modal h3{font-size:1.2rem;margin-bottom:20px}
        .modal .field{margin-bottom:14px}
        .modal textarea{width:100%;padding:10px 14px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:.9rem;resize:vertical;min-height:80px;outline:none;font-family:inherit}
        .modal select{width:100%;padding:10px 14px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:.9rem;outline:none}
        .modal-actions{display:flex;gap:12px;margin-top:20px}
        .modal-actions button{flex:1;padding:10px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:var(--t);border:none}
        .save-btn{background:var(--grad);color:#fff}
        .cancel-btn{background:transparent;border:1px solid var(--border) !important;color:var(--muted)}
        .badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:.7rem;font-weight:600}
        .badge-green{background:rgba(67,233,123,.1);color:#43e97b}
        .badge-blue{background:rgba(102,126,234,.1);color:#667eea}
        .badge-gray{background:rgba(160,160,184,.1);color:var(--muted)}
        .msg-preview{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .empty-state{text-align:center;padding:48px;color:var(--dim)}
        .check-label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);cursor:pointer}
        .check-label input{accent-color:var(--accent)}
        @media(max-width:768px){.data-table{font-size:.8rem}.data-table th,.data-table td{padding:8px 10px}.modal{padding:20px}}
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-wrap" id="login-screen">
        <div class="login-box">
            <h1>Admin Panel</h1>
            <p>Sign in to manage your portfolio</p>
            <form id="login-form">
                <div class="field"><label>Username</label><input type="text" id="login-user" required></div>
                <div class="field"><label>Password</label><input type="password" id="login-pass" required></div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <div class="login-error" id="login-error"></div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin" id="admin-screen">
        <div class="admin-bar">
            <span class="admin-logo">Portfolio Admin</span>
            <div class="admin-bar-right">
                <a href="/" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
                <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="admin-body">
            <div class="admin-tabs" id="admin-tabs">
                <button class="tab-btn active" data-tab="projects">Projects</button>
                <button class="tab-btn" data-tab="skills">Skills</button>
                <button class="tab-btn" data-tab="experience">Experience</button>
                <button class="tab-btn" data-tab="messages">Messages</button>
                <button class="tab-btn" data-tab="profile">Profile</button>
            </div>

            <!-- Projects Tab -->
            <div class="tab-panel active" id="tab-projects">
                <div class="panel-header"><h2>Projects</h2><button class="add-btn" onclick="openProjectModal()"><i class="fas fa-plus"></i> Add Project</button></div>
                <table class="data-table"><thead><tr><th>Title</th><th>Category</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="projects-tbody"></tbody></table>
            </div>

            <!-- Skills Tab -->
            <div class="tab-panel" id="tab-skills">
                <div class="panel-header"><h2>Skills</h2><button class="add-btn" onclick="openSkillModal()"><i class="fas fa-plus"></i> Add Skill</button></div>
                <table class="data-table"><thead><tr><th>Name</th><th>Category</th><th>Proficiency</th><th>Actions</th></tr></thead><tbody id="skills-tbody"></tbody></table>
            </div>

            <!-- Experience Tab -->
            <div class="tab-panel" id="tab-experience">
                <div class="panel-header"><h2>Experience</h2><button class="add-btn" onclick="openExpModal()"><i class="fas fa-plus"></i> Add Experience</button></div>
                <table class="data-table"><thead><tr><th>Title</th><th>Company</th><th>Period</th><th>Actions</th></tr></thead><tbody id="exp-tbody"></tbody></table>
            </div>

            <!-- Messages Tab -->
            <div class="tab-panel" id="tab-messages">
                <div class="panel-header"><h2>Messages</h2></div>
                <table class="data-table"><thead><tr><th>From</th><th>Email</th><th>Message</th><th>Date</th><th>Actions</th></tr></thead><tbody id="messages-tbody"></tbody></table>
            </div>

            <!-- Profile Tab -->
            <div class="tab-panel" id="tab-profile">
                <div class="panel-header"><h2>Profile</h2></div>
                <form id="profile-form" style="max-width:600px">
                    <div class="field"><label>Name</label><input type="text" id="pf-name"></div>
                    <div class="field"><label>Title</label><input type="text" id="pf-title"></div>
                    <div class="field"><label>Bio</label><textarea id="pf-bio"></textarea></div>
                    <div class="field"><label>Email</label><input type="email" id="pf-email"></div>
                    <div class="field"><label>Phone</label><input type="text" id="pf-phone"></div>
                    <div class="field"><label>Location</label><input type="text" id="pf-location"></div>
                    <div class="field"><label>GitHub URL</label><input type="url" id="pf-github"></div>
                    <div class="field"><label>LinkedIn URL</label><input type="url" id="pf-linkedin"></div>
                    <div class="field"><label>Twitter URL</label><input type="url" id="pf-twitter"></div>
                    <button type="submit" class="add-btn" style="margin-top:8px"><i class="fas fa-save"></i> Save Profile</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
    const API='';
    let token=localStorage.getItem('admin_token');

    // Auth
    if(token){verifyToken()}
    document.getElementById('login-form').addEventListener('submit',async e=>{
        e.preventDefault();
        const err=document.getElementById('login-error');
        try{
            const r=await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('login-user').value,password:document.getElementById('login-pass').value})});
            const d=await r.json();
            if(!r.ok){err.textContent=d.error;err.style.display='block';return}
            token=d.token;localStorage.setItem('admin_token',token);showAdmin();
        }catch{err.textContent='Connection error';err.style.display='block'}
    });
    async function verifyToken(){
        try{const r=await fetch(`${API}/api/auth/verify`,{headers:{'Authorization':`Bearer ${token}`}});if(r.ok)showAdmin();else logout()}catch{logout()}
    }
    function showAdmin(){document.getElementById('login-screen').style.display='none';document.getElementById('admin-screen').style.display='block';loadAll()}
    function logout(){token=null;localStorage.removeItem('admin_token');document.getElementById('login-screen').style.display='';document.getElementById('admin-screen').style.display='none'}
    document.getElementById('logout-btn').addEventListener('click',logout);

    // Tabs
    document.getElementById('admin-tabs').addEventListener('click',e=>{
        if(!e.target.classList.contains('tab-btn'))return;
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('tab-'+e.target.dataset.tab).classList.add('active');
    });

    // API helper
    async function api(url,method='GET',body=null){
        const opts={method,headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}};
        if(body)opts.body=JSON.stringify(body);
        const r=await fetch(API+url,opts);return r.json();
    }

    // Load all data
    function loadAll(){loadAdminProjects();loadAdminSkills();loadAdminExp();loadAdminMessages();loadAdminProfile()}

    // Projects
    async function loadAdminProjects(){
        const projects=await api('/api/projects');
        document.getElementById('projects-tbody').innerHTML=projects.map(p=>`<tr>
            <td style="color:var(--text);font-weight:500">${p.title}</td>
            <td><span class="badge badge-blue">${p.category}</span></td>
            <td>${p.featured?'<span class="badge badge-green">Yes</span>':'<span class="badge badge-gray">No</span>'}</td>
            <td><div class="action-btns"><button class="act-btn" onclick="openProjectModal('${p._id}')"><i class="fas fa-edit"></i></button><button class="act-btn del" onclick="deleteItem('projects','${p._id}')"><i class="fas fa-trash"></i></button></div></td>
        </tr>`).join('')||'<tr><td colspan="4" class="empty-state">No projects yet</td></tr>';
    }

    async function openProjectModal(id=null){
        let p={title:'',description:'',long_description:'',tech_stack:[],category:'fullstack',featured:0,live_url:'',github_url:''};
        if(id){const r=await api(`/api/projects/${id}`);if(r)p=r}
        showModal(`<h3>${id?'Edit':'Add'} Project</h3>
            <div class="field"><label>Title</label><input type="text" id="m-title" value="${esc(p.title)}"></div>
            <div class="field"><label>Description</label><textarea id="m-desc">${esc(p.description)}</textarea></div>
            <div class="field"><label>Tech Stack (comma-separated)</label><input type="text" id="m-tech" value="${Array.isArray(p.tech_stack)?p.tech_stack.join(', '):p.tech_stack}"></div>
            <div class="field"><label>Category</label><select id="m-cat"><option value="fullstack" ${p.category==='fullstack'?'selected':''}>Full-Stack</option><option value="frontend" ${p.category==='frontend'?'selected':''}>Frontend</option><option value="backend" ${p.category==='backend'?'selected':''}>Backend</option><option value="mobile" ${p.category==='mobile'?'selected':''}>Mobile</option></select></div>
            <div class="field"><label>Live URL</label><input type="url" id="m-live" value="${esc(p.live_url||'')}"></div>
            <div class="field"><label>GitHub URL</label><input type="url" id="m-github" value="${esc(p.github_url||'')}"></div>
            <label class="check-label"><input type="checkbox" id="m-feat" ${p.featured?'checked':''}> Featured project</label>
            <div class="modal-actions"><button class="cancel-btn" onclick="closeModal()">Cancel</button><button class="save-btn" onclick="saveProject('${id}')">Save</button></div>`);
    }
    async function saveProject(id){
        const d={title:gv('m-title'),description:gv('m-desc'),tech_stack:gv('m-tech'),category:gv('m-cat'),live_url:gv('m-live'),github_url:gv('m-github'),featured:document.getElementById('m-feat').checked};
        await api(id&&id!=='null'?`/api/admin/projects/${id}`:'/api/admin/projects',id&&id!=='null'?'PUT':'POST',d);
        closeModal();loadAdminProjects();
    }

    // Skills
    async function loadAdminSkills(){
        const d=await api('/api/skills');
        document.getElementById('skills-tbody').innerHTML=d.skills.map(s=>`<tr>
            <td style="color:var(--text);font-weight:500">${s.name}</td>
            <td><span class="badge badge-blue">${s.category}</span></td>
            <td>${s.proficiency}%</td>
            <td><div class="action-btns"><button class="act-btn" onclick="openSkillModal('${s._id}','${esc(s.name)}','${esc(s.category)}',${s.proficiency})"><i class="fas fa-edit"></i></button><button class="act-btn del" onclick="deleteItem('skills','${s._id}')"><i class="fas fa-trash"></i></button></div></td>
        </tr>`).join('')||'<tr><td colspan="4" class="empty-state">No skills yet</td></tr>';
    }
    function openSkillModal(id=null,name='',category='Frontend',prof=80){
        showModal(`<h3>${id?'Edit':'Add'} Skill</h3>
            <div class="field"><label>Name</label><input type="text" id="m-sname" value="${esc(name)}"></div>
            <div class="field"><label>Category</label><select id="m-scat"><option ${category==='Frontend'?'selected':''}>Frontend</option><option ${category==='Backend'?'selected':''}>Backend</option><option ${category==='DevOps'?'selected':''}>DevOps</option><option ${category==='Design'?'selected':''}>Design</option></select></div>
            <div class="field"><label>Proficiency (%)</label><input type="number" id="m-sprof" min="0" max="100" value="${prof}"></div>
            <div class="modal-actions"><button class="cancel-btn" onclick="closeModal()">Cancel</button><button class="save-btn" onclick="saveSkill('${id}')">Save</button></div>`);
    }
    async function saveSkill(id){
        const d={name:gv('m-sname'),category:gv('m-scat'),proficiency:parseInt(gv('m-sprof'))||80};
        await api(id&&id!=='null'?`/api/admin/skills/${id}`:'/api/admin/skills',id&&id!=='null'?'PUT':'POST',d);
        closeModal();loadAdminSkills();
    }

    // Experience
    async function loadAdminExp(){
        const exps=await api('/api/experiences');
        document.getElementById('exp-tbody').innerHTML=exps.map(e=>`<tr>
            <td style="color:var(--text);font-weight:500">${e.title}</td>
            <td>${e.company}</td>
            <td>${e.start_date} — ${e.is_current?'Present':e.end_date||''}</td>
            <td><div class="action-btns"><button class="act-btn del" onclick="deleteItem('experiences','${e._id}')"><i class="fas fa-trash"></i></button></div></td>
        </tr>`).join('')||'<tr><td colspan="4" class="empty-state">No experience yet</td></tr>';
    }
    function openExpModal(){
        showModal(`<h3>Add Experience</h3>
            <div class="field"><label>Title</label><input type="text" id="m-etitle"></div>
            <div class="field"><label>Company</label><input type="text" id="m-ecomp"></div>
            <div class="field"><label>Location</label><input type="text" id="m-eloc"></div>
            <div class="field"><label>Start Date (YYYY-MM)</label><input type="text" id="m-estart" placeholder="2024-01"></div>
            <div class="field"><label>End Date (YYYY-MM)</label><input type="text" id="m-eend" placeholder="Leave blank if current"></div>
            <label class="check-label"><input type="checkbox" id="m-ecur"> Current position</label>
            <div class="field" style="margin-top:12px"><label>Description</label><textarea id="m-edesc"></textarea></div>
            <div class="modal-actions"><button class="cancel-btn" onclick="closeModal()">Cancel</button><button class="save-btn" onclick="saveExp()">Save</button></div>`);
    }
    async function saveExp(){
        const d={title:gv('m-etitle'),company:gv('m-ecomp'),location:gv('m-eloc'),start_date:gv('m-estart'),end_date:gv('m-eend')||null,is_current:document.getElementById('m-ecur').checked,description:gv('m-edesc')};
        await api('/api/admin/experiences','POST',d);closeModal();loadAdminExp();
    }

    // Messages
    async function loadAdminMessages(){
        const msgs=await api('/api/admin/contacts');
        document.getElementById('messages-tbody').innerHTML=msgs.map(m=>`<tr>
            <td style="color:var(--text);font-weight:500">${esc(m.name)}</td>
            <td>${esc(m.email)}</td>
            <td class="msg-preview">${esc(m.message)}</td>
            <td style="font-size:.8rem">${new Date(m.createdAt).toLocaleDateString()}</td>
            <td><div class="action-btns"><button class="act-btn del" onclick="deleteItem('contacts','${m._id}')"><i class="fas fa-trash"></i></button></div></td>
        </tr>`).join('')||'<tr><td colspan="5" class="empty-state">No messages yet</td></tr>';
    }

    // Profile
    async function loadAdminProfile(){
        const p=await api('/api/profile');
        if(p){['name','title','bio','email','phone','location','github','linkedin','twitter'].forEach(k=>{const el=document.getElementById('pf-'+k);if(el)el.value=p[k]||''})}
    }
    document.getElementById('profile-form').addEventListener('submit',async e=>{
        e.preventDefault();
        const d={};['name','title','bio','email','phone','location','github','linkedin','twitter'].forEach(k=>d[k]=document.getElementById('pf-'+k).value);
        await api('/api/admin/profile','PUT',d);alert('Profile saved!');
    });

    // Delete
    async function deleteItem(type,id){
        if(!confirm('Delete this item?'))return;
        await api(`/api/admin/${type}/${id}`,'DELETE');
        loadAll();
    }

    // Modal helpers
    function showModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('open')}
    function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}
    document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});

    // Utilities
    function gv(id){return document.getElementById(id)?.value?.trim()||''}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
    </script>
</body>
</html>
